name: Generate CV PDF

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-cv-pdf.yml"
      - "files/cv.tex"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile the CV
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: files
          root_file: cv.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify the generated PDF
        run: test -s files/cv.pdf

      - name: Open a pull request with the updated PDF
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/generate-cv-pdf
          delete-branch: true
          add-paths: files/cv.pdf
          commit-message: Update generated CV PDF
          title: Update generated CV PDF
          body: |
            This pull request regenerates `files/cv.pdf` by compiling `files/cv.tex`.

            Please review the generated document before merging.
