name: Generate CV PDF

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-cv-pdf.yml"
      - "Gemfile"
      - "_config.yml"
      - "_includes/archive-single-cv.html"
      - "_includes/archive-single-talk-cv.html"
      - "_pages/cv.md"
      - "_publications/**"
      - "_sass/**"
      - "_talks/**"
      - "_teaching/**"
      - "assets/css/main.scss"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Build the site
        run: |
          bundle install
          bundle exec jekyll build

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Print the CV to PDF
        run: |
          python3 -m http.server 8000 --directory _site > /tmp/cv-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/cv/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/cv/ > /dev/null
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-pdf-header-footer \
            --virtual-time-budget=5000 \
            --print-to-pdf=files/cv.pdf \
            http://127.0.0.1:8000/cv/
          test -s files/cv.pdf

      - name: Open a pull request with the updated PDF
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/generate-cv-pdf
          delete-branch: true
          add-paths: files/cv.pdf
          commit-message: Update generated CV PDF
          title: Update generated CV PDF
          body: |
            This pull request regenerates `files/cv.pdf` from the rendered CV page.

            Please review the generated document before merging.
