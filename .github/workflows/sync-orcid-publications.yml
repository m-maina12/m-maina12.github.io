name: Sync ORCID publications

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new ORCID works
        run: python scripts/sync_orcid_publications.py

      - name: Open or update publication sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-orcid-publications
          delete-branch: true
          add-paths: _publications/*.md
          commit-message: Add new publications from ORCID
          title: Add new publications from ORCID
          body: |
            This pull request adds new public works found in the configured ORCID record.

            Please review the generated metadata and abstract before merging.
